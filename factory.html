<div id="loader"><div class="panel"><div class="tv">📺</div><div class="bar"><i id="loadBar"></i></div><div class="msg" id="loadMsg">开馆中…</div></div></div>
<main>
<section class="page-hero"><div class="container">
  <div class="crumbs"><a href="index.html"><i data-lucide="home"></i>首页</a> / 梗图工厂</div>
  <h1><i data-lucide="factory" style="width:.85em;height:.85em;vertical-align:-.08em;margin-right:6px"></i><em>梗图工厂</em> · 人人都是 UP 主</h1>
  <p class="lead">选个底色，写两句金句，一张原创梗图即刻出炉。下载发到群里，下个热梗就姓你。</p>
</div></section>
<section class="sec"><div class="container">
  <div class="factory">
    <div class="gen-controls">
      <div><label>底色模板</label>
        <div class="tpl-row" id="tplRow">
          <button class="tpl on" data-t="pink" style="background:linear-gradient(135deg,#FFB6C9,#FB7299,#F25D8E)"><span>高能粉</span></button>
          <button class="tpl" data-t="blue" style="background:linear-gradient(135deg,#8ED8F8,#00A1D6,#0077AA)"><span>冲浪蓝</span></button>
          <button class="tpl" data-t="gold" style="background:linear-gradient(135deg,#FFE7A3,#FFB027,#FF9231)"><span>硬币金</span></button>
          <button class="tpl" data-t="green" style="background:linear-gradient(135deg,#9BFFB6,#38F9D7,#2AC864)"><span>抽象绿</span></button>
        </div>
      </div>
      <div><label for="genTop">上排文字</label><input id="genTop" type="text" maxlength="20" value="前方高能"></div>
      <div><label for="genBottom">下排文字</label><input id="genBottom" type="text" maxlength="20" value="非战斗人员请撤离"></div>
      <div><label for="genSize">字号 <b id="genSizeVal">72</b>px</label><input id="genSize" type="range" min="40" max="110" value="72"></div>
      <div><label for="genPat">底纹</label>
        <select id="genPat" style="width:100%;border:2px solid var(--border);border-radius:12px;padding:10px 14px;background:var(--bg);outline:none">
          <option value="none">纯净无纹</option><option value="dots" selected>圆点波普</option>
          <option value="lines">斜纹拉丝</option><option value="danmu">弹幕残影</option>
        </select>
      </div>
      <div class="gen-row">
        <button class="btn btn-ghost btn-sm" id="genRandom"><i data-lucide="dices"></i>换组金句</button>
        <button class="btn btn-primary btn-sm" id="genDownload"><i data-lucide="download"></i>下载梗图</button>
      </div>
    </div>
    <div class="gen-preview">
      <canvas id="genCanvas" width="800" height="1000"></canvas>
      <p style="font-size:12px;color:var(--muted);margin-top:12px">预览即为成品 · 800×1000 高清直出</p>
    </div>
  </div>
</div></section>
